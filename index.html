<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linha do Tempo LGBTQIAPN+</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>Linha do Tempo LGBTQIAPN+</h1>
    <p class="subtitulo">Direitos, Ciência e Bissexualidades — mundo e Brasil</p>

    <div class="filtros" role="group" aria-label="Filtros">
      <div class="filtro-grupo">
        <span class="filtro-label">Eixo:</span>
        <button class="chip ativo" data-eixo="todos">Todos</button>
        <button class="chip" data-eixo="direitos">Direitos</button>
        <button class="chip" data-eixo="ciencia">Ciência/Psi</button>
        <button class="chip" data-eixo="bi">Bi / Não Monossexual</button>
      </div>
      <div class="filtro-grupo">
        <span class="filtro-label">País:</span>
        <button class="chip ativo" data-pais="todos">Todos</button>
        <button class="chip" data-pais="mundo">Mundo</button>
        <button class="chip" data-pais="brasil">Brasil</button>
      </div>
    </div>

    <div class="legenda" aria-label="Legenda de eixos">
      <span><i class="dot" style="background:#2b6cb0"></i> Direitos</span>
      <span><i class="dot" style="background:#6b46c1"></i> Ciência/Psi</span>
      <span><i class="dot" style="background:#d53f8c"></i> Bi / Não Monossexual</span>
    </div>
  </header>

  <main>
    <section class="timeline" id="timeline" aria-live="polite">
      <!-- cards injetados via JS -->
    </section>
    <p class="vazio" id="vazio" hidden>Nenhum evento com os filtros atuais.</p>
  </main>

  <footer>
    <p>Fontes: CFP, APA, OMS, STF, ONU, CNJ. Datas verificáveis — confira fontes primárias antes de publicar.</p>
  </footer>

  <!-- ============================================================
       MODAL DE DETALHES (novo)
       <dialog> vazio: o JS preenche ao clicar num card.
       O botão de fechar precisa existir aqui, fixo, para o JS só
       ligar o evento de clique — não recriar o botão a cada abertura.
       O atributo aria-labelledby aponta para o <h2> interno, que
       o JS preenche com o título do evento.
       ============================================================ -->
  <dialog id="modal-evento" aria-labelledby="modal-titulo">
    <button type="button" class="modal-fechar" id="modal-fechar" aria-label="Fechar">×</button>
    <div class="modal-conteudo">
      <span class="modal-data" id="modal-data"></span>
      <h2 id="modal-titulo"></h2>
      <p id="modal-resumo"></p>
      <span class="modal-fonte" id="modal-fonte"></span>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
